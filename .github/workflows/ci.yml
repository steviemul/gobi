name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same linters and formatters as `make lint`, configured in .golangci.yml.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Build
        run: go build -o bin/gobi ./cmd/server

      - name: Test
        run: go test -race ./...
